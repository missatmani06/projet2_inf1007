name: Tests Python
on: [push, pull_request]
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Installer les bibliothèques
        run: python -m pip install -r requirements.txt
      - name: Lancer les tests
        run: python -m pytest